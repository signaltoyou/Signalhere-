 function stopImagemove(){
      clearInterval(inervaildid);

 }

  let inervaildid = 0;
   // create the fuction to move the image 
   function startImagemove(){ 
      // we are creating a verible for are html image 
      let memeImage = document.getElementById("memeImage");

     inervaildid= setInterval(function(){
         let topcord = getrandompixels();
         let leftcord = getrandompixels();
         
         memeImage.style.left = leftcord + "px";
         memeImage.style.top = topcord + "px";
      },1000);

     



      document.getElementById("btstart").disabled = true;

      document.getElementById("btstop").disabled = false;
   }



  
   function getrandompixels(){

      return Math.floor(Math.random() * 800);
   }
